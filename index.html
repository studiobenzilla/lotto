<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LOOOK GID Sofubi Lotto — Display</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sarabun:wght@400;700;800&display=swap');

  :root {
    --bg:      #ffffff;
    --panel:   #f2f2f2;
    --card:    #f8f8f8;
    --border:  #e0e0e0;
    --red:     #ff2d55;
    --orange:  #ff9500;
    --blue:    #007aff;
    --green:   #34c759;
    --purple:  #af52de;
    --text:    #111111;
    --muted:   #aaaaaa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    overflow: hidden;
  }

  /* ══════════════════
     SETUP OVERLAY
  ══════════════════ */
  #setup-overlay {
    position: fixed; inset: 0;
    background: rgba(255,255,255,0.98);
    display: flex; align-items: center; justify-content: center;
    z-index: 300;
  }
  .setup-box {
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 28px;
    padding: 48px;
    width: min(480px, 90vw);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.07);
  }
  .setup-t1 { font-family:'Bebas Neue',sans-serif; font-size:48px; color:var(--red); letter-spacing:5px; line-height:1; }
  .setup-t2 { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:4px; margin-bottom:6px; }
  .setup-t2 .og { color:var(--orange); } .setup-t2 .sf { color:var(--purple); } .setup-t2 .lt { color:var(--blue); }
  .setup-sub { font-size:11px; color:var(--muted); letter-spacing:3px; text-transform:uppercase; margin-bottom:36px; font-weight:700; }
  .input-row { display:flex; gap:12px; align-items:flex-end; margin-bottom:18px; }
  .ig { flex:1; text-align:left; }
  .ig label { font-size:11px; color:var(--muted); letter-spacing:1px; display:block; margin-bottom:7px; text-transform:uppercase; font-weight:700; }
  .ig input {
    width:100%; padding:14px;
    background:var(--panel); border:2px solid var(--border);
    border-radius:10px; color:var(--text);
    font-family:'Bebas Neue',sans-serif; font-size:26px;
    text-align:center; letter-spacing:2px; -webkit-appearance:none;
  }
  .ig input:focus { outline:none; border-color:var(--red); }
  .rsep { color:var(--muted); font-size:26px; padding-bottom:12px; }
  .btn-start {
    width:100%; padding:18px;
    background:var(--red); color:#fff;
    border:none; border-radius:12px;
    font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:4px;
    cursor:pointer; box-shadow:0 6px 24px rgba(255,45,85,0.28);
  }
  .btn-start:active { transform:scale(0.98); }

  /* ══════════════════
     APP SHELL
  ══════════════════ */
  #app {
    display: grid;
    grid-template-rows: 64px 1fr;
    height: 100dvh;
  }

  /* HEADER */
  .hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    background: #fff;
    border-bottom: 2px solid var(--border);
  }
  .hdr-title { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:3px; line-height:1; }
  .hdr-title .lo { color:var(--red); }
  .hdr-title .gi { color:var(--orange); }
  .hdr-title .so { color:var(--purple); }
  .hdr-title .lt { color:var(--blue); }
  .hdr-sub { font-size:10px; color:var(--muted); letter-spacing:3px; margin-top:2px; font-weight:700; }

  .hdr-stats { display:flex; }
  .hs {
    padding: 0 24px;
    border-left: 2px solid var(--border);
    text-align: center;
  }
  .hs-v { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:2px; }
  .hs-v.bl { color:var(--blue); } .hs-v.rd { color:var(--red); } .hs-v.gr { color:var(--green); }
  .hs-l { font-size:10px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; font-weight:700; }

  /* ══════════════════
     BODY — 3 columns
     Left: drum+btn
     Center: BIG number spotlight
     Right: winner list
  ══════════════════ */
  .body {
    display: grid;
    grid-template-columns: 280px 1fr 1fr;
    height: 100%; min-height: 0;
  }

  /* ─── LEFT: controls ─── */
  .col-left {
    border-right: 2px solid var(--border);
    background: var(--card);
    display: flex; flex-direction: column;
    padding: 20px 18px; gap: 14px;
    overflow: hidden;
  }

  .drum-wrap {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    background: #fff; border: 2px solid var(--border);
    border-radius: 18px; padding: 18px;
    position: relative; overflow: hidden;
  }
  .drum-ring {
    width: 160px; height: 160px;
    border-radius: 50%;
    border: 4px solid var(--border);
    background: var(--panel);
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .drum-ring.spinning { border-color:var(--red); animation:rpulse 0.1s ease-in-out infinite; }
  .drum-ring.won      { border-color:var(--red); box-shadow:0 0 40px rgba(255,45,85,0.2); }
  .drum-ring.done     { border-color:var(--orange); }
  @keyframes rpulse {
    0%,100% { box-shadow:0 0 8px rgba(255,45,85,0.1); }
    50%      { box-shadow:0 0 32px rgba(255,45,85,0.5); }
  }
  .drum-num {
    font-family:'Bebas Neue',sans-serif;
    font-size:62px; color:var(--red); letter-spacing:3px; line-height:1;
    transition: opacity 0.06s;
  }
  .drum-num.idle { color:var(--muted); font-size:38px; }
  .drum-num.roll { opacity:0.2; }
  .drum-round { font-size:11px; color:var(--muted); letter-spacing:2px; min-height:16px; text-transform:uppercase; font-weight:700; }

  .btn-spin {
    width:100%; padding:14px;
    background:var(--red); color:#fff;
    border:none; border-radius:12px;
    font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:4px;
    cursor:pointer; box-shadow:0 4px 16px rgba(255,45,85,0.3);
    transition: all 0.15s;
  }
  .btn-spin:active:not(:disabled) { transform:scale(0.97); box-shadow:none; }
  .btn-spin:disabled { background:var(--border); color:var(--muted); box-shadow:none; cursor:default; }

  .btn-reset {
    width:100%; padding:9px;
    background:transparent; color:var(--muted);
    border:1.5px solid var(--border); border-radius:9px;
    font-family:'Sarabun',sans-serif; font-size:12px; font-weight:700;
    cursor:pointer;
  }
  .btn-reset:active { color:var(--red); border-color:var(--red); }

  .recent-box { display:flex; flex-direction:column; gap:6px; }
  .sec-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .ri {
    display:flex; align-items:center; gap:10px;
    background:#fff; border:1.5px solid var(--border);
    border-radius:9px; padding:8px 12px;
    animation:sli 0.3s ease;
  }
  .ri.fresh { border-color:var(--red); background:#fff5f7; }
  @keyframes sli { from { opacity:0; transform:translateX(-8px); } to { opacity:1; transform:translateX(0); } }
  .ri-n { font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--red); min-width:52px; letter-spacing:2px; }
  .ri-r { font-size:11px; font-weight:700; }
  .ri-t { font-size:10px; color:var(--muted); }

  /* ─── CENTER: BIG spotlight ─── */
  .col-center {
    border-right: 2px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    background: #fff;
    padding: 24px;
    position: relative; overflow: hidden;
  }
  /* subtle radial bg */
  .col-center::before {
    content:''; position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,45,85,0.04) 0%, transparent 65%);
    pointer-events:none;
  }

  .spot-label {
    font-size:12px; letter-spacing:4px; text-transform:uppercase;
    color:var(--muted); font-weight:700;
  }

  /* BIG circle */
  .spot-ring {
    width: min(38vw, 340px);
    height: min(38vw, 340px);
    border-radius: 50%;
    border: 5px solid var(--border);
    background: var(--panel);
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.3s, box-shadow 0.3s;
    position: relative; z-index: 1;
  }
  .spot-ring.spinning {
    border-color:var(--red);
    animation:spulse 0.1s ease-in-out infinite;
  }
  .spot-ring.won {
    border-color:var(--red);
    box-shadow: 0 0 80px rgba(255,45,85,0.2), 0 0 160px rgba(255,45,85,0.07);
  }
  .spot-ring.done { border-color:var(--orange); }
  @keyframes spulse {
    0%,100% { box-shadow:0 0 20px rgba(255,45,85,0.1); }
    50%      { box-shadow:0 0 70px rgba(255,45,85,0.5); }
  }

  .spot-num {
    font-family:'Bebas Neue',sans-serif;
    font-size: min(18vw, 160px);
    color: var(--red); letter-spacing:6px; line-height:1;
    transition: opacity 0.06s;
  }
  .spot-num.idle { color:var(--muted); font-size: min(9vw, 80px); }
  .spot-num.roll { opacity:0.2; }

  .spot-round {
    font-size:14px; color:var(--muted); letter-spacing:3px;
    min-height:20px; text-transform:uppercase; font-weight:700;
  }

  /* LATEST banner below ring */
  .spot-banner {
    background:var(--red); color:#fff;
    font-family:'Bebas Neue',sans-serif;
    font-size:18px; letter-spacing:4px;
    padding:8px 32px; border-radius:40px;
    opacity:0; transform:translateY(8px);
    transition:all 0.3s ease;
    white-space:nowrap;
  }
  .spot-banner.show { opacity:1; transform:translateY(0); }

  /* ─── RIGHT: winner list ─── */
  .col-right {
    display: flex; flex-direction: column;
    padding: 18px 20px; gap: 12px; min-height: 0;
    background: #fff;
  }
  .rh {
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
  }
  .winner-count {
    font-family:'Bebas Neue',sans-serif; font-size:20px;
    color:var(--red); letter-spacing:2px;
  }

  .wscroll {
    flex:1; overflow-y:auto; min-height:0;
    scrollbar-width:thin; scrollbar-color:var(--border) transparent;
  }
  .w-empty {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; gap:10px; color:var(--muted);
  }
  .w-empty-icon { font-size:44px; opacity:0.18; }
  .w-empty-text { font-size:12px; letter-spacing:3px; font-weight:700; text-transform:uppercase; }

  /* 2-col grid, large numbers */
  .wlist {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px; align-content:start;
  }
  .wrow {
    background:#fff; border:2px solid var(--border);
    border-radius:14px; padding:12px 14px;
    display:flex; align-items:center; gap:10px;
    animation:win-in 0.35s cubic-bezier(0.34,1.5,0.64,1);
    transition:all 0.2s;
  }
  .wrow.latest  { border-color:var(--red); background:#fff5f7; box-shadow:0 4px 16px rgba(255,45,85,0.1); }
  .wrow.waived  { border-color:var(--border); background:var(--panel); opacity:0.5; }
  @keyframes win-in {
    from { opacity:0; transform:scale(0.88) translateY(-4px); }
    to   { opacity:1; transform:scale(1) translateY(0); }
  }

  .wr-rank { font-family:'Bebas Neue',sans-serif; font-size:13px; color:var(--muted); letter-spacing:1px; min-width:26px; }
  .wr-num  {
    font-family:'Bebas Neue',sans-serif;
    font-size:44px; color:var(--red);
    letter-spacing:2px; line-height:1; flex:1;
  }
  .wrow.waived .wr-num { color:var(--muted); text-decoration:line-through; }

  .wr-right { display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
  .badge-new    { font-size:9px; font-weight:800; color:#fff; background:var(--red); padding:2px 7px; border-radius:20px; letter-spacing:1px; white-space:nowrap; }
  .badge-waived { font-size:9px; font-weight:800; color:var(--muted); background:var(--panel); border:1.5px solid var(--border); padding:2px 7px; border-radius:20px; white-space:nowrap; }
  .bw {
    font-size:10px; font-weight:700; color:var(--muted);
    background:transparent; border:1.5px solid var(--border);
    border-radius:7px; padding:4px 9px; cursor:pointer; white-space:nowrap;
  }
  .bw:active { color:var(--red); border-color:var(--red); }
  .br {
    font-size:10px; font-weight:700; color:var(--green);
    background:transparent; border:1.5px solid var(--green);
    border-radius:7px; padding:4px 9px; cursor:pointer; white-space:nowrap;
  }
  .br:active { background:#f0fff4; }

  /* CONFETTI */
  .cp { position:fixed; pointer-events:none; z-index:10000; border-radius:2px; animation:cff linear forwards; }
  @keyframes cff {
    from { opacity:1; transform:translateY(-20px) rotate(0deg); }
    to   { opacity:0; transform:translateY(100vh) rotate(720deg); }
  }
  .hidden { display:none !important; }
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup-overlay">
  <div class="setup-box">
    <div class="setup-t1">LOOOK</div>
    <div class="setup-t2"><span class="og">GID</span> <span class="sf">Sofubi</span> <span class="lt">Lotto</span></div>
    <div class="setup-sub">Wristband Draw · TTE 2026</div>
    <div class="input-row">
      <div class="ig"><label>เริ่มต้น</label><input type="number" id="r-start" value="1" min="1"></div>
      <div class="rsep">—</div>
      <div class="ig"><label>สิ้นสุด</label><input type="number" id="r-end" value="300" min="1"></div>
    </div>
    <button class="btn-start" onclick="initPool()">เริ่มจับสลาก</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <!-- HEADER -->
  <div class="hdr">
    <div>
      <div class="hdr-title">
        <span class="lo">LOOOK</span>&nbsp;
        <span class="gi">GID</span>&nbsp;
        <span class="so">Sofubi</span>&nbsp;
        <span class="lt">Lotto</span>
      </div>
      <div class="hdr-sub">Wristband Draw · TTE 2026</div>
    </div>
    <div class="hdr-stats">
      <div class="hs"><div class="hs-v bl" id="s-total">—</div><div class="hs-l">ทั้งหมด</div></div>
      <div class="hs"><div class="hs-v rd" id="s-drawn">0</div><div class="hs-l">จับแล้ว</div></div>
      <div class="hs"><div class="hs-v gr" id="s-remain">—</div><div class="hs-l">คงเหลือ</div></div>
    </div>
  </div>

  <!-- BODY -->
  <div class="body">

    <!-- LEFT: drum controls -->
    <div class="col-left">
      <div class="drum-wrap">
        <div class="drum-ring" id="drum-ring">
          <div class="drum-num idle" id="drum-num">???</div>
        </div>
        <div class="drum-round" id="drum-round"></div>
      </div>
      <button class="btn-spin" id="btn-spin" onclick="spin()">จับสลาก</button>
      <button class="btn-reset" onclick="resetPool()">↺ รีเซ็ต Pool</button>
      <div class="recent-box" id="recent-box" style="display:none">
        <div class="sec-label" style="margin-bottom:5px">รายการล่าสุด</div>
        <div id="recent-list"></div>
      </div>
    </div>

    <!-- CENTER: big spotlight -->
    <div class="col-center">
      <div class="spot-label">หมายเลขที่ได้รับสิทธิ์</div>
      <div class="spot-ring" id="spot-ring">
        <div class="spot-num idle" id="spot-num">???</div>
      </div>
      <div class="spot-round" id="spot-round"></div>
      <div class="spot-banner" id="spot-banner">ได้รับสิทธิ์ซื้อ ✓</div>
    </div>

    <!-- RIGHT: winner list -->
    <div class="col-right">
      <div class="rh">
        <div class="sec-label">ผู้ได้รับสิทธิ์ซื้อ</div>
        <div class="winner-count" id="winner-count">0 คน</div>
      </div>
      <div class="wscroll">
        <div class="w-empty" id="w-empty">
          <div class="w-empty-icon">🎰</div>
          <div class="w-empty-text">กดจับสลากเพื่อเริ่ม</div>
        </div>
        <div class="wlist" id="wlist" style="display:none"></div>
      </div>
    </div>

  </div>
</div>

<script>
let pool=[], drawn=[], allNums=[], latestNum=null, isSpinning=false;
const pad = n => String(n).padStart(3,'0');
const ts  = () => new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

function initPool(){
  const s=parseInt(document.getElementById('r-start').value);
  const e=parseInt(document.getElementById('r-end').value);
  if(isNaN(s)||isNaN(e)||s<1||e<s){alert('กรุณาตรวจสอบช่วงหมายเลข');return;}
  allNums=[]; for(let i=s;i<=e;i++) allNums.push(i);
  pool=[...allNums]; drawn=[]; latestNum=null;
  document.getElementById('setup-overlay').classList.add('hidden');
  render();
}

function waive(num){
  const d=drawn.find(x=>x.num===num);
  if(!d||d.waived) return;
  if(!confirm(`สละสิทธิ์หมายเลข ${pad(num)} ?`)) return;
  d.waived=true; render();
}
function restore(num){
  const d=drawn.find(x=>x.num===num);
  if(!d) return;
  d.waived=false; render();
}

function render(){
  const active=drawn.filter(d=>!d.waived);
  document.getElementById('s-total').textContent  = allNums.length;
  document.getElementById('s-drawn').textContent  = drawn.length;
  document.getElementById('s-remain').textContent = pool.length;
  document.getElementById('winner-count').textContent = active.length+' คน';

  const btn=document.getElementById('btn-spin');
  btn.disabled=pool.length===0||isSpinning;
  if(pool.length===0){ btn.textContent='จับครบแล้ว!'; document.getElementById('drum-ring').classList.add('done'); }

  // winner list
  const wl=document.getElementById('wlist');
  const we=document.getElementById('w-empty');
  if(drawn.length===0){ we.style.display='flex'; wl.style.display='none'; }
  else {
    we.style.display='none'; wl.style.display='grid';
    wl.innerHTML='';
    const sorted=[
      ...[...drawn].filter(d=>!d.waived).reverse(),
      ...[...drawn].filter(d=>d.waived).reverse()
    ];
    sorted.forEach(d=>{
      const isL=d.num===latestNum&&!d.waived;
      const row=document.createElement('div');
      row.className='wrow'+(isL?' latest':'')+(d.waived?' waived':'');
      row.innerHTML=`
        <div class="wr-rank">#${d.round}</div>
        <div class="wr-num">${pad(d.num)}</div>
        <div class="wr-right">
          ${isL?'<div class="badge-new">ล่าสุด</div>':''}
          ${d.waived
            ?`<div class="badge-waived">สละสิทธิ์</div><button class="br" onclick="restore(${d.num})">คืนสิทธิ์</button>`
            :`<button class="bw" onclick="waive(${d.num})">สละสิทธิ์</button>`
          }
        </div>`;
      wl.appendChild(row);
    });
  }

  // recent (left)
  const rb=document.getElementById('recent-box');
  const rl=document.getElementById('recent-list');
  if(drawn.length>0){
    rb.style.display='flex'; rb.style.flexDirection='column';
    rl.innerHTML='';
    [...drawn].reverse().slice(0,3).forEach((d,i)=>{
      const el=document.createElement('div');
      el.className='ri'+(i===0&&!d.waived?' fresh':'');
      el.innerHTML=`<div class="ri-n" style="${d.waived?'color:var(--muted);text-decoration:line-through':''}">${pad(d.num)}</div><div><div class="ri-r">${d.waived?'สละสิทธิ์':'ได้สิทธิ์ ✓ รอบที่ '+d.round}</div><div class="ri-t">${d.time}</div></div>`;
      rl.appendChild(el);
    });
  } else { rb.style.display='none'; }
}

function spin(){
  if(pool.length===0||isSpinning) return;
  isSpinning=true;
  document.getElementById('btn-spin').disabled=true;

  // both rings sync
  const ring  = document.getElementById('drum-ring');
  const sring = document.getElementById('spot-ring');
  const numEl = document.getElementById('drum-num');
  const snumEl= document.getElementById('spot-num');
  const banner= document.getElementById('spot-banner');

  ring.classList.remove('won','done');   ring.classList.add('spinning');
  sring.classList.remove('won','done');  sring.classList.add('spinning');
  numEl.classList.remove('idle');  numEl.classList.add('roll');
  snumEl.classList.remove('idle'); snumEl.classList.add('roll');
  banner.classList.remove('show');
  document.getElementById('drum-round').textContent='';
  document.getElementById('spot-round').textContent='';

  const idx=Math.floor(Math.random()*pool.length);
  const winner=pool[idx];
  const total=22+Math.floor(Math.random()*14);
  let t=0;
  const iv=setInterval(()=>{
    const fake=pad(pool[Math.floor(Math.random()*pool.length)]);
    numEl.textContent=fake; snumEl.textContent=fake;
    if(++t>=total){ clearInterval(iv); reveal(winner,idx,ring,sring,numEl,snumEl,banner); }
  },70);
}

function reveal(winner,idx,ring,sring,numEl,snumEl,banner){
  pool.splice(idx,1);
  drawn.push({num:winner,round:drawn.length+1,time:ts()});
  latestNum=winner;

  const ns=pad(winner);
  numEl.textContent=ns; snumEl.textContent=ns;
  numEl.classList.remove('roll'); snumEl.classList.remove('roll');
  ring.classList.remove('spinning');  ring.classList.add('won');
  sring.classList.remove('spinning'); sring.classList.add('won');

  const rnd=`รอบที่ ${drawn.length}`;
  document.getElementById('drum-round').textContent=rnd;
  document.getElementById('spot-round').textContent=rnd;

  // show banner with delay
  setTimeout(()=>banner.classList.add('show'), 200);

  confetti(); isSpinning=false; render();
}

function resetPool(){
  if(!confirm('รีเซ็ต Pool ทั้งหมด?')) return;
  document.getElementById('setup-overlay').classList.remove('hidden');
  ['drum-num','spot-num'].forEach(id=>{
    const el=document.getElementById(id);
    el.textContent='???'; el.className=id==='drum-num'?'drum-num idle':'spot-num idle';
  });
  ['drum-ring','spot-ring'].forEach(id=>document.getElementById(id).classList.remove('won','spinning','done'));
  document.getElementById('drum-round').textContent='';
  document.getElementById('spot-round').textContent='';
  document.getElementById('spot-banner').classList.remove('show');
  pool=[]; drawn=[]; allNums=[]; latestNum=null;
}

function confetti(){
  const cols=['#ff2d55','#ff9500','#007aff','#34c759','#af52de','#ffcc00'];
  for(let i=0;i<70;i++){
    const el=document.createElement('div');
    el.className='cp';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${cols[Math.floor(Math.random()*cols.length)]};width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;animation-duration:${1.8+Math.random()*1.8}s;animation-delay:${Math.random()*0.5}s;transform:rotate(${Math.random()*360}deg);`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4000);
  }
}
</script>
